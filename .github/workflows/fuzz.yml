name: Differential and fuzz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Deep fuzz duration in seconds
        required: true
        default: "300"
        type: choice
        options:
          - "120"
          - "300"
          - "600"

permissions:
  contents: read

concurrency:
  group: gint-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compile the independent oracle as C++11 on each supported platform.
  differential:
    name: deterministic differential (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-gcc
            os: ubuntu-24.04
            cxx: g++-13
            compiler_package: g++-13
          - name: x86_64-clang
            os: ubuntu-24.04
            cxx: clang++-18
            compiler_package: clang-18
          - name: aarch64-gcc
            os: ubuntu-24.04-arm
            cxx: g++-13
            compiler_package: g++-13
          - name: aarch64-clang
            os: ubuntu-24.04-arm
            cxx: clang++-18
            compiler_package: clang-18
          - name: macos-appleclang
            os: macos-26
            cxx: c++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select stable Xcode
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          test -d /Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Verify stable Xcode
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version | grep -Fx 'Xcode 26.6'
          xcrun clang++ --version
      - name: Install compiler
        if: runner.os == 'Linux'
        env:
          COMPILER_PACKAGE: ${{ matrix.compiler_package }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$COMPILER_PACKAGE"
      - name: Install libFuzzer runtime and symbolizer
        if: matrix.name == 'x86_64-clang' && github.event_name == 'pull_request'
        run: sudo apt-get install -y --no-install-recommends libclang-rt-18-dev llvm-18
      - name: Run C++11 deterministic differential checks
        env:
          CXX: ${{ matrix.cxx }}
          GINT_DIFFERENTIAL_ITERATIONS: "512"
        run: scripts/run-differential.sh
      - name: Reject negative iteration counts
        run: |
          status=0
          runs/differential/differential_test -18446744073709551615 || status=$?
          test "$status" -eq 2
      - name: Run short libFuzzer smoke
        if: matrix.name == 'x86_64-clang' && github.event_name == 'pull_request'
        env:
          CXX: clang++-18
        run: scripts/run-fuzz.sh 10

  deep-fuzz:
    # Keep sanitizer fuzzing on Linux x86_64, where GitHub's Clang package ships
    # a stable libFuzzer runtime. AppleClang remains covered by the main CI suite.
    name: deep Clang libFuzzer
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev llvm-18
      - name: Restore accumulated fuzz corpus
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: runs/fuzz/corpus/
          key: gint-fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gint-fuzz-corpus-${{ runner.os }}-
      - name: Run sanitizer-backed differential fuzzing
        env:
          CXX: clang++-18
          GINT_FUZZ_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_seconds || '300' }}
        run: scripts/run-fuzz.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gint-fuzz-crashes
          path: runs/fuzz/artifacts/
          if-no-files-found: ignore
